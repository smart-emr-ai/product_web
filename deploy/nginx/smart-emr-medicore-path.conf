# Temporary product website mount for an already-approved Smart EMR domain.
# Add these locations inside the existing 443 `server_name smart-emr.cn;` block.
# Build the product site with `VITE_BASE_PATH=/medicore/` and deploy it under:
#   /opt/smart-emr/apps/product-web/dist/medicore
#
# Public temporary URL:
#   https://smart-emr.cn/medicore/
#
# Remove this snippet after medicore.org.cn finishes Volcengine ICP access filing.

location = /medicore-analytics/script.js {
    proxy_pass http://umami:3000/script.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=3600" always;
}

location = /medicore-analytics/api/heartbeat {
    proxy_pass http://umami:3000/api/heartbeat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location ^~ /medicore-analytics/api/ {
    proxy_pass http://umami:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
}

location = /medicore {
    return 301 /medicore/;
}

location ^~ /medicore/assets/ {
    root /usr/share/nginx/product-web;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* ^/medicore/.*\.(?:webp|png|jpg|jpeg|svg|mp4|webm|woff2?)$ {
    root /usr/share/nginx/product-web;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

location ^~ /medicore/ {
    root /usr/share/nginx/product-web;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /medicore/index.html;
}
