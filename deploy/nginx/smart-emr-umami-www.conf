# Temporary Umami admin entry on the already-approved Smart EMR www host.
# Replace the existing `www.smart-emr.cn` 443 redirect server block with this
# proxy while medicore.org.cn is still blocked by Volcengine ICP access filing.
#
# Public temporary URL:
#   https://www.smart-emr.cn/login
#
# Main Smart EMR remains on:
#   https://smart-emr.cn/
#
# Remove this override after medicore.org.cn can serve Umami at /analytics.

server {
    listen 443 ssl;
    server_name www.smart-emr.cn;

    ssl_certificate     /etc/nginx/ssl/smart-emr.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/smart-emr.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://umami:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
