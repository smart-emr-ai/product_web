# MediCore product website Nginx server blocks.
# Mount the built dist directory at /usr/share/nginx/product-web and mount
# Let's Encrypt files at /etc/nginx/ssl/letsencrypt before enabling.
server {
    listen 80;
    server_name medicore.org.cn www.medicore.org.cn;

    root /usr/share/nginx/product-web;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://www.medicore.org.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name medicore.org.cn;

    ssl_certificate     /etc/nginx/ssl/letsencrypt/live/medicore.org.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/medicore.org.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.medicore.org.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name www.medicore.org.cn;

    ssl_certificate     /etc/nginx/ssl/letsencrypt/live/medicore.org.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/medicore.org.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/product-web;
    index index.html;

    location = /script.js {
        proxy_pass http://umami:3000/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location ^~ /api/ {
        proxy_pass http://umami:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    location ^~ /_next/ {
        proxy_pass http://umami:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /analytics {
        return 302 /login;
    }

    location ~ ^/(login|logout|settings|profile|websites|teams|reports|share)(/.*)?$ {
        proxy_pass http://umami:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|svg|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
